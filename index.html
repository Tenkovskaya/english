<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Английский A1–B2: тест с объяснениями, тренажёры, письменные задания, грамматика и карточки. English A1–B2 practice.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b8323f">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English">
<title>English A1–B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Single study column; unit colours cycle through six hues. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --fg:#1b1d2a; --muted:#5d6278; --line:#dfe2ec;
  --accent:#b8323f; --accent-ink:#ffffff;
  --ok:#1f8a53; --ok-bg:#e3f5ea; --bad:#c2372f; --bad-bg:#fbe7e5; --warn:#a26300; --warn-bg:#fdf1db;
  --l1:#6f7fe0; --l2:#2fa3a0; --l3:#8d63d6; --l4:#d9709f; --l5:#dd8a3a; --l6:#d6b21f; --lp:#5a7d3a;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131b; --surface:#1b1d29; --fg:#ecedf5; --muted:#a3a7bd; --line:#2d3042;
  --accent:#ff8a93; --accent-ink:#2a0d10;
  --ok:#5fd394; --ok-bg:#163223; --bad:#ff8a80; --bad-bg:#3a1c1b; --warn:#f2b552; --warn-bg:#382a12;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12131b; --surface:#1b1d29; --fg:#ecedf5; --muted:#a3a7bd; --line:#2d3042;
  --accent:#ff8a93; --accent-ink:#2a0d10;
  --ok:#5fd394; --ok-bg:#163223; --bad:#ff8a80; --bad-bg:#3a1c1b; --warn:#f2b552; --warn-bg:#382a12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 .flag{display:inline-flex;gap:3px;vertical-align:middle;margin-left:10px}
h1 .flag i{width:10px;height:28px;border-radius:2px;display:block}
.lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 12px 7px 10px;font:500 .9rem var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .n{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 16%, transparent)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,input:focus-visible,.key:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg);padding:8px 14px;font:500 .9rem var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 18px;font:600 1rem var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.small{font-size:.88rem;color:var(--muted)}
.linkbtn{appearance:none;background:none;border:0;color:var(--accent);font:500 .9rem var(--body);cursor:pointer;padding:0;text-decoration:underline}
/* quiz */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.tag .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.count{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.question{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,4vw,1.55rem);line-height:1.3;margin:0;text-wrap:balance}
.question em{font-style:normal;background:color-mix(in srgb,var(--accent) 14%, transparent);padding:0 4px;border-radius:4px}
.hint{color:var(--muted);font-size:.92rem;margin-top:-6px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px 14px;font:500 1.02rem var(--body);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none;margin-top:2px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.inrow input{flex:1 1 220px;min-width:0;font:500 1.1rem var(--body);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.inrow input.right{border-color:var(--ok);background:var(--ok-bg)}
.inrow input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;min-width:34px;padding:6px 8px;font:500 1rem var(--body);cursor:pointer}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--ok-bg);color:var(--fg)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-bg)} .fb.bad b{color:var(--bad)}
.fb.warn{background:var(--warn-bg)} .fb.warn b{color:var(--warn)}
.fb .ans{font-weight:600}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* results */
.score{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,4.5rem);line-height:1;letter-spacing:-.03em}
.verdict{font-size:1.05rem}
.topics{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 110px 56px;gap:10px;align-items:center;font-size:.92rem}
.trow .mini{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.trow .mini i{display:block;height:100%;background:var(--c)}
.trow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.mist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mist li{border-left:3px solid var(--bad);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mist .q{font-weight:600}
.mist .yours{color:var(--bad);font-size:.9rem}
.mist .corr{color:var(--ok);font-size:.9rem}
.mist .ex{color:var(--muted);font-size:.88rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:440px){.trow{grid-template-columns:minmax(0,1fr) 70px 46px}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1.5px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.tabs a{white-space:nowrap;flex:none;padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs a[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gram h2 .q{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.85rem}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn.sm{padding:7px 12px;font-size:.88rem}
.toc{display:flex;flex-wrap:wrap;gap:6px 14px}
.toc a{color:var(--accent);font-size:.92rem;text-decoration:none}
.toc a:hover{text-decoration:underline}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.sk{font-style:italic}
.tw{overflow-x:auto}
.tw table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:460px}
.tw table.two{min-width:0}
.tw th,.tw td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tw thead th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tw tbody th{font-weight:600;white-space:nowrap}
.tw td b{color:var(--accent)}
.tw .q{text-transform:none;letter-spacing:0;font-weight:400}
.note{margin:0;color:var(--muted);font-size:.93rem}
.note b{color:var(--fg)}
.gram{scroll-margin-top:60px}
.cardzone{align-items:stretch}
.fcard{appearance:none;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;min-height:230px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;text-align:center;font-family:var(--body)}
.fcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fcard.flipped{border-color:var(--accent)}
.fmeta{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.fmeta .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fword{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.15;overflow-wrap:anywhere}
.fback{font-size:1.25rem;font-weight:500;color:var(--accent);overflow-wrap:anywhere}
.ftap{font-size:.82rem;color:var(--muted)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gender{font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.langbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.langbar .seg button{padding:5px 12px;font-size:.82rem}
.wsList{display:flex;flex-direction:column;gap:8px}
.wsSec{margin-top:10px}
.wsItem{appearance:none;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);font:inherit;cursor:pointer}
.wsItem:hover{border-color:var(--accent)}
.wsItem>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.wsScore{flex:none;font-family:var(--mono);font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.wsScore.full{color:var(--ok);border-color:var(--ok)}
.wsScore.part{color:var(--warn);border-color:var(--warn)}
.wsLines{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:12px;font-size:1.05rem;line-height:1.9}
.wsText{margin:0;font-size:1.05rem;line-height:2.3}
.blank{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px;max-width:100%}
.wsIn{font:500 1rem var(--body);padding:3px 8px;border:0;border-bottom:2px solid var(--muted);background:color-mix(in srgb,var(--accent) 6%,transparent);color:var(--fg);border-radius:4px 4px 0 0;max-width:100%;min-width:4ch}
.wsIn:focus{outline:none;border-bottom-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wsIn.right{border-bottom-color:var(--ok);background:var(--ok-bg)}
.wsIn.wrong{border-bottom-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-color:var(--bad)}
.wsIn.near{border-bottom-color:var(--warn);background:var(--warn-bg)}
.wsIn:disabled{color:var(--fg);opacity:1}
.corr{color:var(--ok);font-weight:600;font-size:.95rem}
#vTrain,#vProg{display:flex;flex-direction:column;gap:14px}
#vTrain[hidden],#vProg[hidden]{display:none}
.trPrompt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line)}
.trVerb{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.1}
.trBadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.badge{font-size:.85rem;font-weight:600;border-radius:999px;padding:3px 10px;border:1.5px solid var(--line);background:var(--surface)}
.badge.t-pres{border-color:var(--l3)}.badge.t-fut{border-color:var(--l4)}.badge.t-past{border-color:var(--l5)}.badge.t-imp{border-color:var(--l2)}
.badge.neg{border-color:var(--bad);color:var(--bad)}
#trIn{flex:1 1 220px;min-width:0;font:500 1.1rem var(--body);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
#trIn.right{border-color:var(--ok);background:var(--ok-bg)}#trIn.wrong{border-color:var(--bad);background:var(--bad-bg)}#trIn.near{border-color:var(--warn);background:var(--warn-bg)}
.mini-t{font-size:.9rem}.mini-t th{width:90px}
.bTr{margin:0;font-size:1.05rem;font-weight:500;color:var(--muted)}
.bAns{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bPool{display:flex;flex-wrap:wrap;gap:8px}
.tok{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;font:500 1.05rem var(--body);cursor:pointer}
.tok:hover:not(:disabled){border-color:var(--accent)}
.tok.on{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:var(--accent)}
.tok:disabled{cursor:default}
.timer{font-family:var(--mono);font-size:.95rem;font-weight:600;border:1.5px solid var(--line);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none}
.tile:hover{border-color:var(--accent)}
.tile .big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.recs li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.recs li:last-child{border-bottom:0}
.trModes .chip{--c:var(--accent)}
.trModes .chip .dot{display:none}
.readTxt{margin:0;font-size:1.05rem;line-height:1.7;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.rdList{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.rdList li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.rdList li .seg button{padding:6px 12px}
.rdList li.right .rdS{color:var(--ok)}.rdList li.wrong .rdS{color:var(--bad)}
.rdS{flex:1 1 200px;min-width:0}
#wTxt{width:100%;font:500 1rem/1.6 var(--body);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
.checklist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:6px}
.checklist li{font-size:.92rem}.checklist li.right{color:var(--ok)}.checklist li.wrong{color:var(--muted)}
.tIn{flex:1 1 220px;min-width:0;font:500 1.1rem var(--body);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.tIn.right{border-color:var(--ok);background:var(--ok-bg)}.tIn.wrong{border-color:var(--bad);background:var(--bad-bg)}.tIn.near{border-color:var(--warn);background:var(--warn-bg)}
.dlg{display:flex;flex-direction:column;gap:8px}
.dl{padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.dl b{font-weight:600;color:var(--muted)}
.dl.ok{border-color:var(--ok);background:var(--ok-bg)}.dl.bad{border-color:var(--bad);background:var(--bad-bg)}
.dl s{color:var(--bad);margin-left:6px}
.oralQ{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,4.5vw,1.6rem);line-height:1.3;text-wrap:balance}
.oPoints{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.oTimer{font-family:var(--mono);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.oTimer.low{color:var(--bad)}
#oSec button{padding:6px 10px;font-size:.85rem}
.lesbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lesbar .chip{padding:4px 11px 4px 9px;font-size:.84rem}
.plan{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:12px;align-items:center}
.prow .mini{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prow .mini i{display:block;height:100%;background:var(--accent)}
.prow.done .mini i{background:var(--ok)}
.prow .pc{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:right}
.streak{font-family:var(--display);font-weight:800;font-size:1.6rem}
#pDate{font:500 1rem var(--body);padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
@media (max-width:440px){.prow{grid-template-columns:minmax(0,1fr) 60px}.prow .btn{grid-column:1/-1;justify-self:start}}
.dline{display:block}
.dyour{font-weight:500}
del.dx{color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-thickness:2px;border-radius:3px;padding:0 1px}
ins.dx{color:var(--ok);text-decoration:none;font-weight:800;border-bottom:3px solid var(--ok);padding:0 1px}
.corr ins.dx{border-bottom-width:2px}
.hero{gap:12px}
.greet{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px 20px;font-size:1.15rem;border-radius:14px;width:100%;text-align:left}
.bigbtn .sub{font-size:.88rem;font-weight:500;opacity:.85}
button.tile{appearance:none;font:inherit;text-align:left;cursor:pointer}
.tile b{font-family:var(--display);font-size:1.1rem}
[hidden]{display:none!important}img{max-width:100%}
.lvlseg button{min-width:3.2em;font-weight:800}
.lvlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvlhero{display:flex;gap:10px;flex-wrap:wrap}
.lvlhero button{flex:1 1 140px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:left}
.lvlhero button b{font-family:var(--display);font-size:1.3rem}

.wshead{display:flex;flex-wrap:wrap;align-items:center;column-gap:10px}

.ruledlg[open]{display:flex;flex-direction:column}

.rulehead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rulex{border:0;background:transparent;font-size:1.1rem;cursor:pointer;color:inherit;padding:4px 8px;border-radius:8px}
.rulex:hover{background:var(--line)}
.rulebody{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:22px}
.rulesec{display:flex;flex-direction:column;gap:14px}
.rulesec .ghead{margin:0}
.rulefoot{padding:12px 18px;border-top:1px solid var(--line)}
html[lang="en"] .lr{display:none}html:not([lang="en"]) .le{display:none}

.lvlhero button small{color:var(--muted);font-size:.82rem}
.say{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;flex:none}
.say:hover{border-color:var(--accent)}
.ipa{font-family:var(--mono);font-size:.85rem;color:var(--muted)}

/* Grammar reference: one section per unit. id = test topic id. */
const RL=(ru,en)=>`<span class="lr">${ru}</span><span class="le">${en}</span>`;

    ["much — обычно в вопросах и отрицаниях; в утверждениях — a lot of.","much mainly in questions and negatives; a lot of in positives."],
    ["enough: перед сущ. ("+ex("enough money")+"), после прил. ("+ex("big enough")+").","enough before nouns, after adjectives."],
    ["some-/any-/no-/every- + body/thing/where: "+ex("somebody, anything, nowhere, everywhere")+".","some-/any-/no-/every- + body/thing/where."]));

gs("pp",11,"Present Perfect","Present Perfect",

 ul(["Опыт в жизни (без времени): "+ex("I've been to Paris. Have you ever tried sushi?"),"Life experience (no time): "+ex("I've been to Paris.")],
    ["Результат сейчас: "+ex("I've lost my keys (и сейчас их нет)."),"A present result: "+ex("I've lost my keys.")],
    ["just / already — между have и V3; yet — в конце вопроса/отрицания.","just / already go before the participle; yet goes at the end."],
    ["for + период ("+ex("for 3 years")+"), since + момент ("+ex("since 2020, since Monday")+").","for + a period, since + a starting point."],
    ["Есть законченное время (yesterday, in 2018, ago) → Past Simple: "+ex("I <b>went</b> there in 2018."),"A finished time → Past Simple."],
    [ex("been")+" — был и вернулся; "+ex("gone")+" — уехал и ещё там.","been = went and came back; gone = still there."]));

gs("mod",12,"Модальные: must, have to, should, might","Modals: must, have to, should, might",
 tb([RL("глагол","verb"),RL("значение","meaning"),RL("пример","example")],[
  ["must","необходимо, правило / я считаю нужным","You must wear a seatbelt."],
  ["have to","нужно (обстоятельства)","I have to get up at 6."],
  ["mustn't","нельзя, запрещено","You mustn't smoke here."],
  ["don't have to","не нужно, не обязательно","You don't have to come."],
  ["should / shouldn't","совет","You should see a doctor."],
  ["might / may","возможно","It might rain."],
  ["could / can","просьба; can — разрешение","Could you help me?"]].map(r=>[r[0],RL(r[1],["necessary, a rule","necessary (circumstances)","not allowed","not necessary","advice","possibility","requests"][["must","have to","mustn't","don't have to","should / shouldn't","might / may","could / can"].indexOf(r[0])]),ex(r[2])])),
 ul(["Прошедшее: must / have to → <b>had to</b>; can → <b>could</b>.","Past: must / have to → had to; can → could."],
    ["После модальных — глагол без to (кроме have to, ought to).","After modals: bare verb (except have to, ought to)."],
    ["Объектные местоимения после глагола и предлога: me, you, him, her, it, us, them.","Object pronouns after verbs and prepositions: me, him, her, us, them."]));

 ul(["Действие началось в прошлом и продолжается: "+ex("I've been learning English for three years."),"Started in the past and still going on."],
    ["Видимый результат процесса: "+ex("You're out of breath! Have you been running?"),"A visible result of an activity."],
    ["Simple — сколько сделано ("+ex("I've written 3 emails")+"), Continuous — как долго ("+ex("I've been writing emails all morning")+").","Simple = how many / result; Continuous = how long / activity."],
    ["Глаголы состояния (know, have, like, be) — только Simple: "+ex("I've known her for years."),"State verbs stay simple: "+ex("I've known her for years.")]));

    ["Уточняющие (с запятыми) — доп. информация; <b>that нельзя</b>: "+ex("My sister, who lives in Rome, is a nurse."),"Non-defining (commas): extra information; no that."],

/* Writing tasks: [answer/alternative] marks a gap. u = unit. */
const WS=[
{u:1,id:"w1",t:"To be: am / is / are",ru:["Вставьте am, is или are (можно сокращения).","Fill in am, is or are (short forms are fine)."],items:["I [am] a student.","My sister [is] twenty.","We [are] from Poland.","[Are] you tired?","Where [is] the station?","They [aren't/are not] at home. (not)","It [isn't/is not] my phone. (not)","[Is] your brother married?"]},
{u:2,id:"w2",t:"Present Simple: my day",ru:["Глаголы в скобках в Present Simple.","Put the verbs in the Present Simple."],items:["Anna [gets] up at seven. (get)","She [has] breakfast at home. (have)","She [goes] to work by bus. (go)","Her husband [doesn't work/does not work] on Fridays. (not work)","They [watch] TV in the evening. (watch)","[Does] Anna [like] her job? (like)","My brother [studies] medicine. (study)","I [don't eat/do not eat] meat. (not eat)"]},
{u:3,id:"w3",t:"a / an / the / —",ru:["Вставьте a, an, the или «-» (без артикля).","Fill in a, an, the or - (no article)."],items:["She's [an] engineer.","I've got [a] cat. [The] cat is black.","[The] moon is beautiful tonight.","I don't like [-] coffee.","He plays [the] violin.","We went there by [-] train.","It takes [an] hour.","Can you pass [the] salt, please?"]},
{u:4,id:"w4",t:"There is / are + some / any",ru:["Вставьте is / are / isn't / aren't и some / any.","Fill in is / are / isn't / aren't and some / any."],items:["There [is] a sofa in the living room.","There [are] [some] books on the shelf.","There [aren't/are not] [any] chairs in the kitchen.","[Is] there [any] milk?","There [isn't/is not] a lift in our building.","[Are] there [any] shops near here?","The lamp is [on] the table.","I live [in] Prague."]},
{u:5,id:"w5",t:"Can, time and frequency",ru:["Вставьте can / can't, предлоги времени и наречия.","Fill in can / can't, time prepositions and adverbs."],items:["Fish [can] swim, but they [can't/cannot] fly.","[Can] you speak French?","The film starts [at] 8 o'clock.","My birthday is [in] July.","We don't work [on] Sundays.","I go to the gym three times a week. → I [often] go to the gym.","I'm [never] late. (0%)","[Don't] touch that! It's hot."]},
{u:6,id:"w6",t:"Present Continuous / was / were",ru:["Present Continuous или was / were.","Present Continuous or was / were."],items:["Look! The baby [is sleeping]. (sleep)","I [am writing/'m writing] an email at the moment. (write)","What [are] you [doing]? (do)","They [aren't playing/are not playing] now. (not play)","I [was] at the cinema yesterday.","My parents [were] in Spain last summer.","Where [were] you born?","The lesson [wasn't/was not] boring. (not)"]},
{u:7,id:"w7",t:"Last weekend",ru:["Глаголы в Past Simple или Past Continuous.","Past Simple or Past Continuous."],items:["Last Saturday I [went] to the market. (go)","I [bought] some fruit. (buy)","Then I [met] my friend Kate. (meet)","We [had] coffee together. (have)","We [didn't stay/did not stay] long. (not stay)","[Did] you [enjoy] the weekend? (enjoy)","I [was reading] when you called. (read)","While we [were walking], it started to rain. (walk)"]},
{u:8,id:"w8",t:"Comparing things",ru:["Сравнительная или превосходная степень.","Comparative or superlative."],items:["A car is [faster] than a bike. (fast)","This is [the best] pizza in town. (good)","Today is [hotter] than yesterday. (hot)","Russian is [more difficult] than Spanish. (difficult)","It was [the worst] day of my life. (bad)","She's [the happiest] person I know. (happy)","My flat isn't as big [as] yours.","Moscow is [bigger] than Kyiv. (big)"]},
{u:9,id:"w9",t:"Future forms",ru:["will, going to или Present Continuous.","will, going to or Present Continuous."],items:["I'm cold. — I [will close/'ll close] the window. (close)","Look at the sky! It [is going to/'s going to] snow. (snow)","We [are meeting/'re meeting] Tom at 7 tonight. (meet)","I think Brazil [will win/'ll win] the match. (win)","She [is going to/'s going to] study law next year. (study)","I promise I [won't/will not] forget. (not forget)","I'll call you when I [arrive]. (arrive)","The bus [leaves] at 6:30 every morning. (leave)"]},
{u:10,id:"w10",t:"Quantities",ru:["much / many / a few / a little / some / any.","much / many / a few / a little / some / any."],items:["How [many] apples do you need?","How [much] money have you got?","I've got [a few] friends in Berlin.","Can I have [a little] milk in my tea?","There isn't [much] time.","Would you like [some] cake?","Have you got [any] questions?","There were too [many] people at the concert."]},
{u:11,id:"w11",t:"Present Perfect or Past Simple?",ru:["Present Perfect или Past Simple.","Present Perfect or Past Simple."],items:["I [have never been/'ve never been] to India. (never / be)","[Have] you ever [seen] a whale? (see)","She [went] to Rome last year. (go)","We [have lived/'ve lived] here since 2019. (live)","I [have just finished/'ve just finished] my report. (just / finish)","He [hasn't called/has not called] yet. (not call)","When [did] you [start] learning English? (start)","I [have known/'ve known] him for ten years. (know)"]},
{u:12,id:"w12",t:"Rules and advice",ru:["must / mustn't / have to / don't have to / should.","must / mustn't / have to / don't have to / should."],items:["You [mustn't] use your phone in the exam. It's forbidden.","It's free. You [don't have to] pay.","You look ill. You [should] see a doctor.","She [has to] work on Saturdays. (it's her job)","I [had to] wait for an hour yesterday.","You [shouldn't] drink so much coffee.","Please call [me] tomorrow. (I)","I don't know [them]. (they)"]},
{u:13,id:"w13",t:"How long…?",ru:["Present Perfect Simple или Continuous; for / since.","Present Perfect Simple or Continuous; for / since."],items:["I [have been learning/'ve been learning] English for two years. (learn)","She's tired. She [has been working/'s been working] all day. (work)","I [have read/'ve read] three books this month. (read)","We've been friends [since] 2010.","He's lived here [for] five years.","How long [have] you [been waiting]? (wait)","I [have known/'ve known] Jack for ages. (know)","It [has been raining/'s been raining] since morning. (rain)"]},
{u:14,id:"w14",t:"If…",ru:["Нулевое, первое или второе условное.","Zero, first or second conditional."],items:["If you mix red and blue, you [get] purple. (get)","If it [rains], we'll stay in. (rain)","If I [had] a car, I'd drive to work. (have)","I [would buy/'d buy] a house if I won the lottery. (buy)","If I [were/was] you, I'd apologise. (be)","We'll be late [unless] we hurry.","If you [see] Kate, tell her to call me. (see)","What [would] you do if you lost your passport?"]},
{u:15,id:"w15",t:"The passive",ru:["Глагол в пассиве.","Use the passive."],items:["Spanish [is spoken] in Mexico. (speak)","The pyramids [were built] thousands of years ago. (build)","My car [has been stolen]! (steal)","The results [will be announced] tomorrow. (announce)","The house [is being painted] at the moment. (paint)","This song was written [by] John Lennon.","When [was] the telephone [invented]? (invent)","Coffee [is grown] in Brazil. (grow)"]},

{u:17,id:"w17",t:"Reported speech",ru:["Перескажите в косвенной речи.","Report what they said."],items:["\"I'm busy.\" → She said she [was] busy.","\"I live in Oslo.\" → He said he [lived] in Oslo.","\"I'll help you.\" → He said he [would] help me.","\"I lost my keys.\" → She said she [had lost] her keys.","\"Where do you work?\" → He asked me where I [worked].","\"Do you like cats?\" → She asked [if/whether] I liked cats.","\"Sit down.\" → The doctor told me [to sit] down.","\"Don't shout.\" → Mum told us [not to shout]."]},

const store={get(k,d){try{const v=localStorage.getItem("en_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("en_"+k,JSON.stringify(v))}catch(e){}}};
let LANG=store.get("lang",(navigator.language||"ru").toLowerCase().startsWith("en")?"en":"ru");

const CONTR=[[/\bcan't\b/g,"can not"],[/\bcannot\b/g,"can not"],[/\bwon't\b/g,"will not"],[/\bshan't\b/g,"shall not"],[/n't\b/g," not"],[/'m\b/g," am"],[/'re\b/g," are"],[/'ve\b/g," have"],[/'ll\b/g," will"],[/'d\b/g," would"],[/'s\b(?=\s+(been|got|gone|done|had|lost|left|finished|eaten|seen|worked|lived|written|known)\b)/g," has"],[/\b(he|she|it|that|there|what|who|where|here)'s\b/g,"$1 is"],[/^'s\b/g,"is"]];
function nrm(s){s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,;:"“”«»]/g," ").replace(/\s+/g," ").trim();
  if(/^[-–—0]$/.test(s)||s==="no article")return "-";CONTR.forEach(([r,t])=>s=s.replace(r,t));return s.replace(/\s+/g," ").trim()}

function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

function judge(given,alts,strict){const g=nrm(given);if(!g)return {ok:false,near:false,best:alts[0]};

  let i=0,j=0,out="";while(i<m||j<n){if(i<m&&j<n&&a[i]===b[j]){out+=esc(B[j]);i++;j++}else if(j<n&&(i>=m||L[i][j+1]>=L[i+1][j])){out+=`<ins class="dx">${esc(B[j])}</ins>`;j++}else{out+=`<del class="dx">${esc(A[i])}</del>`;i++}}

function vocQ(units,n){const pool=W.filter(w=>units.includes(w.u));if(pool.length<4)return [];
  const lvPool=W.filter(w=>lvU().includes(w.u));
  return shuffle(pool).slice(0,n).map(w=>{const dir=Math.random()<.5?"en":"ru";
    const others=shuffle(lvPool.filter(x=>x.en!==w.en&&x.ru!==w.ru)).slice(0,3);
    const o=dir==="en"?[w.ru,...others.map(x=>x.ru)]:[w.en,...others.map(x=>x.en)];
    return {id:"v:"+w.k,t:"voc",u:w.u,voc:true,w,q:()=>u(dir==="en"?"vqEn":"vqRu",esc(dir==="en"?w.en:w.ru)),mc:true,o,a:[o[0]],e:[`${w.en} — ${w.ru}`,`${w.en} — ${w.ru}`]}})}
function startQuiz(list,exam){if(!list.length)return;clearInterval(timerId);
  run={list,idx:0,res:[],exam:!!exam,end:exam?Date.now()+20*60e3:0};show("quiz");
  $("#qTimer").hidden=!exam;if(exam){tick();timerId=setInterval(tick,1000)}renderQ()}
function tick(){const left=Math.max(0,Math.round((run.end-Date.now())/1000));$("#qTimer").textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;$("#qTimer").classList.toggle("low",left<=60);if(!left)finish()}
$("#go").onclick=()=>{const g=shuffle(Q.filter(q=>UNI.has(q.u)));const units=UNI.size?[...UNI]:lvU();let list;
  if(len==="all")list=[...g,...(useVoc?vocQ(units,30):[])];
  else{const total=+len,nv=useVoc?(g.length?Math.round(total*.25):total):0,ng=Math.min(g.length,total-nv);list=[...g.slice(0,ng),...(useVoc?vocQ(units,total-ng):[])]}
  startQuiz(shuffle(list))};
$("#goExam").onclick=()=>startQuiz(shuffle([...shuffle(Q.filter(q=>lvU().includes(q.u))).slice(0,24),...vocQ(lvU(),6)]),true);
$("#goMist").onclick=()=>startQuiz(shuffle(mistL()));
function show(id){["start","quiz","result"].forEach(s=>$("#"+s).hidden=s!==id);if(id!=="start")window.scrollTo({top:0})}
const qText=q=>typeof q.q==="function"?q.q():esc(q.q).replace(/___/g,"<em>___</em>");
function renderQ(){const q=run.list[run.idx];run.answered=false;
  $("#barFill").style.width=(run.idx/run.list.length*100)+"%";$("#qCount").textContent=`${run.idx+1} / ${run.list.length}`;
  const tag=$("#qTag");tag.style.setProperty("--c",ucol(q.u));tag.lastChild.textContent=q.voc?u("vocTag",q.u):`${q.u}. ${uTitle(q.u)}`;
  $("#qRule").hidden=!!q.voc;$("#qRule").title=u("rule");
  $("#qText").innerHTML=qText(q);$("#fb").hidden=true;$("#next").hidden=true;
  const opts=$("#opts");opts.innerHTML="";$("#inBox").hidden=q.mc;
  if(q.mc){shuffle(q.o).forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="k">${k+1}</span><span></span>`;b.lastChild.textContent=o;b.onclick=()=>answerMC(b,o);opts.appendChild(b)})}
  else{const i=$("#ans");i.value="";i.className="";i.disabled=false;$("#check").disabled=false;setTimeout(()=>i.focus({preventScroll:true}),30)}}
function answerMC(btn,o){if(run.answered)return;const q=run.list[run.idx],ok=o===q.a[0];
  $$("#opts .opt").forEach(b=>{b.disabled=true;if(!run.exam&&b.lastChild.textContent===q.a[0])b.classList.add("right")});
  if(!run.exam&&!ok)btn.classList.add("wrong");record(ok,o,false)}
function answerIn(){if(run.answered)return;const q=run.list[run.idx],i=$("#ans");if(!i.value.trim())return;
  const r=judge(i.value,q.a);i.disabled=true;$("#check").disabled=true;if(!run.exam)i.className=r.ok?"right":"wrong";record(r.ok,i.value,r.near,r.best)}
$("#check").onclick=answerIn;$("#ans").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();run&&run.answered?next():answerIn()}});
function sentenceOf(q,a){if(typeof q.q!=="string"||!q.q.includes("___")||/^(Write|Make)/.test(q.q)||a==="—"||a==="-")return "";
  return q.q.replace(/\s*\([^)]*\)\s*\.?$/,m=>m.trim().endsWith(".")?".":"").replace(/\s*\([^)]*\)/g,"").replace("___",a.replace(/^'/,"")).replace(/\s+/g," ")}
function record(ok,given,near,best){const q=run.list[run.idx];run.answered=true;run.res.push({q,ok,given});dayInc("quiz");
  if(q.voc){const s=srs[q.w.k];if(!ok){srs[q.w.k]=[0,Date.now()];store.set("srs",srs)}else if(!s){srs[q.w.k]=[1,Date.now()+DAY];store.set("srs",srs)}}
  else{const s=qst[q.id]||[0,0];s[1]++;if(ok){s[0]++;mist.delete(q.id)}else mist.add(q.id);qst[q.id]=s;store.set("qst",qst);store.set("mist",[...mist])}
  if(run.exam){setTimeout(next,250);return}
  const fb=$("#fb");fb.hidden=false;fb.className="fb "+(ok?"ok":near?"warn":"bad");
  const corr=best||q.a[0];const sent=sentenceOf(q,q.a[0]);
  fb.innerHTML=`<b>${ok?u("right"):near?u("almost"):u("wrong")}</b>`+(ok?"":`<span>${u("answer")} <span class="ans">${q.mc?esc(q.a[0]):diffHTML(given,corr)}</span></span>`)+
    `<span>${esc(L2(...q.e))}</span>`+(sent?`<span class="row" style="gap:8px">${sayBtn(sent)}<span class="small">${esc(sent)}</span></span>`:q.voc?`<span>${sayBtn(q.w.en)}</span>`:"");
  $("#next").hidden=false;$("#next").focus({preventScroll:true})}
function next(){if(!run)return;if(run.idx<run.list.length-1){run.idx++;renderQ()}else finish()}
$("#next").onclick=next;$("#quit").onclick=()=>{if(run&&run.res.length)finish();else{clearInterval(timerId);run=null;show("start");renderChips()}};
function finish(){clearInterval(timerId);if(!run)return;const r=run.res,n=r.length||1,ok=r.filter(x=>x.ok).length,pct=Math.round(ok/n*100);
  show("result");$("#qTimer").hidden=true;$("#rScore").textContent=pct+"%";
  $("#rVerdict").innerHTML=`${ok} / ${r.length}<br><span class="small">${u(pct>=90?"v90":pct>=70?"v70":pct>=50?"v50":"v0")}</span>`;
  const by={};r.forEach(x=>{const k=x.q.u;(by[k]=by[k]||[0,0])[1]++;if(x.ok)by[k][0]++});
  $("#rUnits").innerHTML=Object.keys(by).sort((a,b)=>a-b).map(k=>{const [a,b]=by[k],p=Math.round(a/b*100);return `<div class="trow" style="--c:${ucol(+k)}"><span>${k}. ${esc(uTitle(+k))}</span><span class="mini"><i style="width:${p}%"></i></span><span class="pct">${a}/${b}</span></div>`}).join("");
  const bad=r.filter(x=>!x.ok);$("#retryMist").hidden=!bad.length;run.bad=bad.map(x=>x.q);
  $("#rMist").innerHTML=bad.length?bad.map(x=>`<li><span class="q">${qText(x.q)}</span><span class="yours">${u("yours")} ${esc(x.given)}</span><span class="corr">${u("answer")} ${esc(x.q.a[0])}</span><span class="ex">${esc(L2(...x.q.e))}</span></li>`).join(""):`<li style="border-color:var(--ok)">${u("noMist")}</li>`;
  renderChips()}
$("#retryMist").onclick=()=>run&&run.bad&&startQuiz(shuffle(run.bad));
$("#toStart").onclick=()=>{run=null;show("start");renderChips()};

let curWs=null;
const wsLv=()=>WS.filter(w=>lvU().includes(w.u));
function wsList(){$("#wsList").innerHTML=wsLv().map(w=>{const b=wsBest[w.id],n=w.items.join(" ").match(/\[[^\]]*\]/g).length;
  return `<button class="wsItem" data-id="${w.id}"><span><span class="tag" style="--c:${ucol(w.u)}"><span class="dot"></span>${u("unit",w.u)} · ${esc(uTitle(w.u))}</span><b>${esc(w.t)}</b></span><span class="wsScore ${b==null?"":b>=n?"full":"part"}">${b==null?u("notDone"):`${b} / ${n}`}</span></button>`}).join("");
  $$("#wsList .wsItem").forEach(b=>b.onclick=()=>openWs(WS.find(w=>w.id===b.dataset.id)))}
function openWs(w){curWs=w;$("#wsListBox").hidden=true;$("#wsOne").hidden=false;$("#wsTitle").textContent=w.t;
  $("#wsRu").textContent=L2(...w.ru)+(w.items.some(s=>s.includes("[-]"))?" "+u("wsZero"):"");
  $("#wsItems").innerHTML=w.items.map(s=>"<li>"+s.split(/(\[[^\]]*\])/).map(p=>{if(p[0]!=="[")return esc(p);const alts=p.slice(1,-1).split("/");const w=Math.max(4,Math.max(...alts.map(a=>a.length))+1);
    return `<span class="blank"><input class="wsIn" data-a="${esc(alts.join("|"))}" style="width:${Math.min(w,26)}ch" autocomplete="off" autocapitalize="off" spellcheck="false"></span>`}).join("")+"</li>").join("");

  const ins=$$("#wsItems .wsIn");ins.forEach((i,k)=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();(ins[k+1]||$("#wsCheck")).focus()}}))}

$("#wsCheck").onclick=()=>{const ins=$$("#wsItems .wsIn");if(ins.some(i=>!i.value.trim())){const r=$("#wsRes");r.hidden=false;r.className="fb warn";r.innerHTML=`<b>${u("wsFill")}</b>`;return}
  let ok=0;ins.forEach(i=>{const alts=i.dataset.a.split("|"),r=judge(i.value,alts,true);i.disabled=true;i.className="wsIn "+(r.ok?"right":r.near?"near":"wrong");if(r.ok)ok++;
    const nx=i.nextElementSibling;if(nx)nx.remove();if(!r.ok){const s=document.createElement("span");s.className="corr";s.textContent=alts[0];i.after(s)}});
  const n=ins.length;wsBest[curWs.id]=Math.max(wsBest[curWs.id]||0,ok);store.set("ws",wsBest);dayInc("ws");

let CUN=lvSel("cu"),cDir=store.get("cdir","en"),cFilt=store.get("cfilt","todo"),deck=[],ci=0,flipped=false;
const SRS_INT=[0,1,3,7,14,30];
const isDue=k=>!srs[k]||srs[k][1]<=Date.now();
const learned=k=>srs[k]&&srs[k][0]>=2;
function buildDeck(){const ws=W.filter(w=>CUN.has(w.u));deck=shuffle(cFilt==="todo"?ws.filter(w=>isDue(w.k)):ws);ci=0;flipped=false;renderCardCtl()}
function renderCardCtl(){$("#cUnits").innerHTML=lvU().map(n=>`<button class="chip" style="--c:${ucol(n)}" data-u="${n}" aria-pressed="${CUN.has(n)}"><span class="dot"></span>${n}. ${esc(L2(...VT[n-1]))} <span class="n">${W.filter(w=>w.u===n).length}</span></button>`).join("");
  $$("#cUnits .chip").forEach(b=>b.onclick=()=>{const n=+b.dataset.u;if(CUN.has(n)&&CUN.size>1)CUN.delete(n);else CUN.add(n);store.set("cu_"+LEVEL,[...CUN]);buildDeck();renderCard()});
  $$("#cDir button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===cDir));$$("#cFilter button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===cFilt));
  const ws=W.filter(w=>CUN.has(w.u));$("#cStat").textContent=u("cStat",ws.filter(w=>learned(w.k)).length,ws.length)}
$$("#cDir button").forEach(b=>b.onclick=()=>{cDir=b.dataset.v;store.set("cdir",cDir);flipped=false;renderCardCtl();renderCard()});
$$("#cFilter button").forEach(b=>b.onclick=()=>{cFilt=b.dataset.v;store.set("cfilt",cFilt);buildDeck();renderCard()});
function renderCard(){renderCardCtl();const w=deck[ci],done=!w;$("#fcard").hidden=done;$("#cDone").hidden=!done;$(".cbtns").hidden=done;$("#cSay").hidden=done;
  $("#cBar").style.width=(deck.length?ci/deck.length*100:100)+"%";$("#cCount").textContent=deck.length?`${Math.min(ci+1,deck.length)} / ${deck.length}`:"";if(done)return;
  const meta=$("#cMeta");meta.style.setProperty("--c",ucol(w.u));meta.innerHTML=`<span class="dot"></span>${u("unit",w.u)} · ${esc(L2(...VT[w.u-1]))}`;
  $("#cFront").textContent=cDir==="en"?w.en:w.ru;$("#cBack").textContent=cDir==="en"?w.ru:w.en;
  $("#cBack").hidden=!flipped;$("#cTap").hidden=flipped;$("#fcard").classList.toggle("flipped",flipped);
  $("#cSay").innerHTML=(cDir==="en"||flipped)?sayBtn(w.en):"";if(cDir==="en"&&!flipped&&store.get("autosay",false))say(w.en)}
function flip(){if(!deck[ci])return;flipped=!flipped;renderCard();if(flipped&&cDir==="ru")say(deck[ci].en)}
function mark(know){const w=deck[ci];if(!w)return;dayInc("cards");const s=srs[w.k]||[0,0];
  if(know){const st=Math.min((s[0]||0)+1,5);srs[w.k]=[st,Date.now()+SRS_INT[st]*DAY-36e5];ci++}
  else{srs[w.k]=[0,Date.now()];deck.splice(ci,1);deck.splice(Math.min(ci+3,deck.length),0,w)}
  store.set("srs",srs);flipped=false;renderCard()}
$("#fcard").onclick=flip;$("#cYes").onclick=()=>mark(true);$("#cNo").onclick=()=>mark(false);
$("#cPrev").onclick=()=>{if(ci>0){ci--;flipped=false;renderCard()}};$("#cShuffle").onclick=()=>{deck=shuffle(deck);ci=0;flipped=false;renderCard()};
document.addEventListener("keydown",e=>{if(VIEW!=="cards"||e.target.tagName==="INPUT")return;if(e.key===" "){e.preventDefault();flip()}else if(e.key==="ArrowRight")mark(true);else if(e.key==="ArrowLeft")mark(false)});

const tStat=(k,ok)=>{dayInc("tr");const s=tst[k]||[0,0];s[1]++;if(ok)s[0]++;tst[k]=s;store.set("tst",tst)};
const statTxt=k=>{const s=tst[k]||[0,0];return u("stat",s[0],s[1])};
const TRM=[["irr","mIrr"],["tense","mTense"],["build","mBuild"],["dict","mDict"],["dlg","mDlg"],["oral","mOral"]];
let trMode=store.get("trmode","irr");if(!TRM.some(m=>m[0]===trMode))trMode="irr";

function setTrMode(m){trMode=m;store.set("trmode",m);
  $("#trMode").innerHTML=TRM.map(([v,k])=>`<button class="chip" data-v="${v}" aria-pressed="${v===m}">${u(k)}</button>`).join("");
  $$("#trMode .chip").forEach(b=>b.onclick=()=>{if(oTimer){clearInterval(oTimer);oTimer=null}setTrMode(b.dataset.v)});
  ({irr:irrRender,tense:tnRender,build:bRender,dict:dRender,dlg:dlgRender,oral:oRender})[m]()}
const unitsUpTo=()=>lvU();
const trPanel=(inner)=>{$("#trBox").innerHTML=`<section class="panel">${inner}</section>`};

/* irregular verbs */
function irrPool(){const lim={A1:1,A2:2,B1:3,B2:3}[LEVEL];return IRR.filter(v=>v.lv<=lim)}
function irrRender(){if(!TR.irr)TR.irr=rnd(irrPool());const v=TR.irr;
  trPanel(`<div class="row" style="justify-content:space-between"><h2>${u("mIrr")}</h2><span class="count">${statTxt("irr")}</span></div>
   <p class="hint" style="margin:0">${u("irrHint")}</p>
   <div class="trPrompt"><span class="row" style="gap:10px"><span class="trVerb">${esc(v.b)}</span>${sayBtn(v.b)}</span><span class="small">${esc(v.ru)}</span></div>
   <div class="inrow"><input class="tIn" id="irP" placeholder="${u("irrP")}" autocomplete="off" autocapitalize="off" spellcheck="false"><input class="tIn" id="irPP" placeholder="${u("irrPP")}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
   <div id="trFb" class="fb" hidden></div>
   <div class="actions" style="justify-content:flex-end"><button class="btn" id="trChk">${u("check")}</button><button class="btn ghost" id="trNx">${u("nextTask")}</button></div>`);
  const p=$("#irP"),pp=$("#irPP");setTimeout(()=>p.focus({preventScroll:true}),30);
  p.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();pp.focus()}};pp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();TR.done?nx():chk()}};
  const chk=()=>{if(TR.done)return;const a=judge(p.value,v.p.split("/"),true),b=judge(pp.value,v.pp.split("/"),true);TR.done=true;
    p.className="tIn "+(a.ok?"right":"wrong");pp.className="tIn "+(b.ok?"right":"wrong");p.disabled=pp.disabled=true;const ok=a.ok&&b.ok;tStat("irr",ok);
    const fb=$("#trFb");fb.hidden=false;fb.className="fb "+(ok?"ok":"bad");fb.innerHTML=`<b>${ok?u("right"):u("wrong")}</b><span class="ans">${esc(v.b)} – ${esc(v.p)} – ${esc(v.pp)}</span><span>${sayBtn(v.b+", "+v.p.replace("/"," or ")+", "+v.pp.replace("/"," or "))}</span>`;$("#trNx").focus()};
  const nx=()=>{TR.irr=rnd(irrPool());TR.done=false;irrRender()};$("#trChk").onclick=chk;$("#trNx").onclick=nx}

/* tenses */
const TENSES={ps:["Present Simple","A1"],pc:["Present Continuous","A1"],pa:["Past Simple","A2"],pac:["Past Continuous","A2"],wi:["Future (will)","A2"],gt:["be going to","A2"],pp:["Present Perfect","A2"],
  ppc:["Present Perfect Continuous","B1"],pf:["Past Perfect","B2"],pfc:["Past Perfect Continuous","B2"],fc:["Future Continuous","B2"],fp:["Future Perfect","B2"]};
const SUBJS=["I","you","he","she","we","they"];
const avail=()=>Object.keys(TENSES).filter(t=>LVN.indexOf(TENSES[t][1])<=LVN.indexOf(LEVEL));
function conj(v,s,t,f){const third=s==="he"||s==="she",be={I:"am"}[s]||(third?"is":"are"),was=(s==="I"||third)?"was":"were",hv=third?"has":"have";
  const S=s==="I"?"I":s;const cap=x=>x[0].toUpperCase()+x.slice(1);
  const aux=(a,rest)=>f==="+"?`${S} ${a} ${rest}`:f==="-"?`${S} ${a} not ${rest}`:`${cap(a)} ${S} ${rest}?`;
  switch(t){
   case "ps":return f==="+"?`${S} ${third?v.s:v.b}`:aux(third?"does":"do",v.b);
   case "pc":return aux(be,v.ing);case "pa":return f==="+"?`${S} ${v.p}`:aux("did",v.b);case "pac":return aux(was,v.ing);
   case "wi":return aux("will",v.b);case "gt":return aux(be,"going to "+v.b);case "pp":return aux(hv,v.pp);case "ppc":return aux(hv,"been "+v.ing);
   case "pf":return aux("had",v.pp);case "pfc":return aux("had","been "+v.ing);case "fc":return aux("will","be "+v.ing);case "fp":return aux("will","have "+v.pp)}}
let tnSel=null;
const shortF=a=>a.replace(/\b(do|does|did|is|are|was|were|have|has|had) not\b/g,"$1n't").replace(/\bwill not\b/g,"won't").replace(/^I am\b/,"I'm");
function tnRender(){const av=avail();let sel=new Set((store.get("tn_"+LEVEL,null)||av).filter(t=>av.includes(t)));if(!sel.size)sel=new Set(av);tnSel=sel;
  if(!TR.tn||!sel.has(TR.tn.t))TR.tn={v:rnd(VB),s:rnd(SUBJS),t:rnd([...sel]),f:rnd(["+","+","-","?"])};const T=TR.tn;
  const fl={"+":u("pos"),"-":u("neg"),"?":u("que")}[T.f];
  trPanel(`<div class="row" style="justify-content:space-between"><h2>${u("mTense")}</h2><span class="count">${statTxt("tense")}</span></div>
   <div style="display:flex;flex-direction:column;gap:6px"><span class="label">${u("tTenses")}</span><div class="chips" id="tnT">${av.map(t=>`<button class="chip" style="--c:var(--accent)" data-t="${t}" aria-pressed="${sel.has(t)}"><span class="dot"></span>${TENSES[t][0]}</button>`).join("")}</div></div>
   <p class="hint" style="margin:0">${u("tnHint")}</p>
   <div class="trPrompt"><span class="trVerb">${esc(T.s)} + ${esc(T.v.b)}</span><span class="small">${esc(T.v.ru)}</span><span class="trBadges"><span class="badge t-past">${TENSES[T.t][0]}</span><span class="badge ${T.f==="-"?"neg":""}">${fl}</span></span></div>
   <div class="inrow"><input class="tIn" id="tnIn" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="trChk">${u("check")}</button></div>
   <div id="trFb" class="fb" hidden></div>
   <div class="actions" style="justify-content:flex-end"><button class="btn ghost" id="trNx">${u("nextTask")}</button></div>`);
  $$("#tnT .chip").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(sel.has(t)&&sel.size>1)sel.delete(t);else sel.add(t);store.set("tn_"+LEVEL,[...sel]);if(!sel.has(TR.tn.t))TR.tn=null;tnRender()});
  const inp=$("#tnIn");setTimeout(()=>inp.focus({preventScroll:true}),30);const ans=conj(T.v,T.s,T.t,T.f);
  const chk=()=>{if(TR.done||!inp.value.trim())return;TR.done=true;const r=judge(inp.value,[ans],true);inp.disabled=true;inp.className="tIn "+(r.ok?"right":r.near?"near":"wrong");tStat("tense",r.ok);
    const fb=$("#trFb");fb.hidden=false;fb.className="fb "+(r.ok?"ok":r.near?"warn":"bad");const sh=shortF(ans);fb.innerHTML=`<b>${r.ok?u("right"):r.near?u("almost"):u("wrong")}</b><span class="row" style="gap:8px"><span class="ans">${r.ok?esc(ans):diffHTML(inp.value,ans)}</span>${sayBtn(ans)}</span>${sh!==ans?`<span class="small">= ${esc(sh)}</span>`:""}`;$("#trNx").focus()};
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();TR.done?nx():chk()}};
  const nx=()=>{TR.tn=null;TR.done=false;tnRender()};$("#trChk").onclick=chk;$("#trNx").onclick=nx}

/* sentence builder */
const tokens=s=>s.match(/[A-Za-z0-9'’-]+|[.,!?]/g).filter(x=>!/^[.,!?]$/.test(x));
function bRender(){const pool=SENT.filter(x=>unitsUpTo().includes(x[0]));
  if(!TR.b||!pool.includes(TR.b.s)){const s=rnd(pool);const tk=tokens(s[1]);let sh;do{sh=shuffle(tk.map((t,i)=>({t,i})))}while(tk.length>2&&sh.every((x,k)=>x.i===k));TR.b={s,tk,sh,ans:[],done:false}}
  const B=TR.b;
  trPanel(`<div class="row" style="justify-content:space-between"><h2>${u("mBuild")}</h2><span class="count">${statTxt("build")}</span></div>
   <p class="hint" style="margin:0">${u("bHint")}</p><p class="bTr">${esc(B.s[2])}</p>
   <div class="bAns" id="bAns">${B.ans.map((x,k)=>`<button class="tok on" data-k="${k}"${B.done?" disabled":""}>${esc(x.t)}</button>`).join("")}</div>
   <div class="bPool" id="bPool">${B.sh.map((x,k)=>B.ans.includes(x)?"":`<button class="tok" data-k="${k}"${B.done?" disabled":""}>${esc(x.t)}</button>`).join("")}</div>
   <div id="trFb" class="fb" hidden></div>
   <div class="actions"><button class="btn ghost" id="bReset">${u("bReset")}</button><div class="row"><button class="btn" id="trChk">${u("check")}</button><button class="btn ghost" id="trNx">${u("nextTask")}</button></div></div>`);
  $$("#bPool .tok").forEach(b=>b.onclick=()=>{B.ans.push(B.sh[+b.dataset.k]);bRender()});
  $$("#bAns .tok").forEach(b=>b.onclick=()=>{B.ans.splice(+b.dataset.k,1);bRender()});
  $("#bReset").onclick=()=>{if(!B.done){B.ans=[];bRender()}};
  $("#trChk").onclick=()=>{if(B.done||B.ans.length<B.tk.length)return;B.done=true;const got=B.ans.map(x=>x.t).join(" "),ok=nrm(got)===nrm(B.tk.join(" "));tStat("build",ok);B.ok=ok;bRender()};
  $("#trNx").onclick=()=>{TR.b=null;bRender()};
  if(B.done){const fb=$("#trFb");fb.hidden=false;fb.className="fb "+(B.ok?"ok":"bad");fb.innerHTML=`<b>${B.ok?u("right"):u("wrong")}</b><span class="row" style="gap:8px"><span class="ans">${esc(B.s[1])}</span>${sayBtn(B.s[1])}</span>`}}

/* dictation */
function dRender(){if(!canSpeak){trPanel(`<h2>${u("mDict")}</h2><p class="fb warn">${u("dictNo")}</p>`);return}
  const pool=SENT.filter(x=>unitsUpTo().includes(x[0]));if(!TR.d||!pool.includes(TR.d.s))TR.d={s:rnd(pool),done:false};const D=TR.d;
  trPanel(`<div class="row" style="justify-content:space-between"><h2>${u("mDict")}</h2><span class="count">${statTxt("dict")}</span></div>
   <p class="hint" style="margin:0">${u("dictHint")}</p>
   <div class="row"><button class="btn" id="dPlay">🔊 ${u("listen")}</button><button class="btn ghost" id="dSlow">🐢 ${u("dictSlow")}</button></div>
   <textarea id="wTxt" rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
   <div id="trFb" class="fb" hidden></div>
   <div class="actions" style="justify-content:flex-end"><button class="btn" id="trChk">${u("check")}</button><button class="btn ghost" id="trNx">${u("nextTask")}</button></div>`);
  $("#dPlay").onclick=()=>say(D.s[1]);$("#dSlow").onclick=()=>say(D.s[1],.65);
  const t=$("#wTxt");t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();D.done?nx():chk()}};
  const chk=()=>{if(D.done||!t.value.trim())return;D.done=true;const r=judge(t.value,[D.s[1]],true);tStat("dict",r.ok);t.disabled=true;
    const fb=$("#trFb");fb.hidden=false;fb.className="fb "+(r.ok?"ok":r.near?"warn":"bad");fb.innerHTML=`<b>${r.ok?u("right"):r.near?u("almost"):u("wrong")}</b><span class="ans">${r.ok?esc(D.s[1]):diffHTML(t.value,D.s[1])}</span><span class="small">${esc(D.s[2])}</span>`};
  const nx=()=>{TR.d=null;dRender();setTimeout(()=>say(TR.d.s[1]),150)};$("#trChk").onclick=chk;$("#trNx").onclick=nx}

/* dialogues */
function dlgRender(){const pool=DLG.filter(d=>d.u.some(x=>unitsUpTo().includes(x)));const use=pool.length?pool:DLG;
  if(!TR.g||!use.includes(TR.g.d)){const d=rnd(use);TR.g={d,pos:0,ok:0,gaps:d.lines.filter(x=>Array.isArray(x[1])).length,shown:[]}}
  const g=TR.g;
  trPanel(`<div class="row" style="justify-content:space-between"><h2>${esc(g.d.t)}</h2><span class="count">${statTxt("dlg")}</span></div>
   <p class="hint" style="margin:0">${u("dlgHint")}</p><div class="dlg" id="dLines"></div><div class="opts" id="dOpts"></div><div id="trFb" class="fb" hidden></div>
   <div class="actions" style="justify-content:flex-end"><button class="btn ghost" id="trNx">${u("nextTask")}</button></div>`);
  const lines=$("#dLines");g.shown.forEach(([sp,txt,cls,bad])=>{const d=document.createElement("div");d.className="dl "+(cls||"");d.innerHTML=`<b></b><span></span>`;d.firstChild.textContent=sp+": ";d.lastChild.textContent=txt;if(bad){const s=document.createElement("s");s.textContent=bad;d.appendChild(s)}lines.appendChild(d)});
  while(g.pos<g.d.lines.length&&!Array.isArray(g.d.lines[g.pos][1])){const [sp,t]=g.d.lines[g.pos];g.shown.push([sp,t]);g.pos++;return dlgRender()}
  if(g.pos>=g.d.lines.length){const fb=$("#trFb");fb.hidden=false;fb.className="fb "+(g.ok===g.gaps?"ok":"warn");fb.innerHTML=`<b>${u("dlgScore",g.ok,g.gaps)}</b>`}
  else{const [sp,opts]=g.d.lines[g.pos];shuffle(opts).forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="k">${k+1}</span><span></span>`;b.lastChild.textContent=t;
    b.onclick=()=>{const ok=t===opts[0];if(ok)g.ok++;tStat("dlg",ok);g.shown.push([sp,opts[0],ok?"ok":"bad",ok?"":t]);g.pos++;dlgRender()};$("#dOpts").appendChild(b)})}
  $("#trNx").onclick=()=>{TR.g=null;dlgRender()}}

/* speaking */
let oTimer=null,oSecs=store.get("osec",60),oLeft=0;
function oRender(){const pool=ORAL.filter(x=>unitsUpTo().includes(x[0]));if(!TR.o||!pool.includes(TR.o.q)){TR.o={q:rnd(pool),shown:false};oLeft=oSecs}
  const O=TR.o;
  trPanel(`<div class="row" style="justify-content:space-between;gap:12px"><h2>${u("mOral")}</h2><div class="seg" id="oSec">${[30,60,120].map(s=>`<button data-v="${s}" aria-pressed="${s===oSecs}">${s<60?s+" s":s/60+" min"}</button>`).join("")}</div></div>
   <p class="hint" style="margin:0">${u("oHint")}</p>
   <div class="row" style="gap:10px;align-items:flex-start"><p class="oralQ" style="margin:0;flex:1">${esc(O.q[1])}</p>${sayBtn(O.q[1])}</div>
   <div class="row" style="gap:14px"><span class="oTimer" id="oTimer"></span><button class="btn" id="oGo">${oTimer?u("oStop"):u("oStart")}</button><button class="btn ghost" id="oShow">${u("oShow")}</button></div>
   <div class="fb ok" id="oAns"${O.shown?"":" hidden"}><span class="small">${u("oSample")}</span><span class="row" style="gap:8px;align-items:flex-start"><span class="ans" style="flex:1">${esc(O.q[2])}</span>${sayBtn(O.q[2])}</span></div>
   <div class="actions" style="justify-content:flex-end"><button class="btn ghost" id="trNx">${u("nextTask")}</button></div>`);
  const tickO=()=>{const el=$("#oTimer");if(!el)return;el.textContent=oLeft<=0&&!oTimer&&TR.o.timeUp?u("oTime"):`${Math.floor(oLeft/60)}:${String(oLeft%60).padStart(2,"0")}`;el.classList.toggle("low",oLeft<=10)};tickO();
  $$("#oSec button").forEach(b=>b.onclick=()=>{oSecs=+b.dataset.v;store.set("osec",oSecs);if(!oTimer)oLeft=oSecs;oRender()});
  const stop=()=>{clearInterval(oTimer);oTimer=null};
  $("#oGo").onclick=()=>{if(oTimer){stop();oRender();return}if(oLeft<=0)oLeft=oSecs;TR.o.timeUp=false;
    oTimer=setInterval(()=>{oLeft--;if(oLeft<=0){stop();TR.o.timeUp=true;TR.o.shown=true;tStat("oral",true);if(trMode==="oral"&&VIEW==="train")oRender();return}tickO()},1000);oRender()};
  $("#oShow").onclick=()=>{TR.o.shown=true;oRender()};$("#trNx").onclick=()=>{stop();TR.o=null;oRender()}}

/* ================= home ================= */
function renderHome(){const lvW=W.filter(w=>lvU().includes(w.u)),due=lvW.filter(w=>srs[w.k]&&isDue(w.k)).length,mc=mistL().length;
  const goals=[["quiz","gQuiz","#test"],["tr","gTr","#train"],["ws","gWs","#write"],["cards","gCards","#cards"]];
  $("#homeBox").innerHTML=`
  <section class="panel hero"><span class="greet">${u("hello")}</span><span class="label">${u("lvChoose")}</span>
   <div class="lvlhero">${LVN.map(l=>`<button data-l="${l}" aria-pressed="${l===LEVEL}"><b>${l}</b><small>${u("lv"+l)}</small></button>`).join("")}</div></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>${u("todayPlan")}</h2><span class="streak">🔥 ${streak.last===today()||streak.last===yesterday()?streak.n:0}</span></div>
   <div class="plan">${goals.map(([k,lab,href])=>{const v=Math.min(dayGet(k),GOAL[k]),p=v/GOAL[k]*100;return `<div class="prow${p>=100?" done":""}"><span>${p>=100?"✓ ":""}${u(lab)}</span><span class="mini"><i style="width:${p}%"></i></span><a class="btn ghost sm" href="${href}">${u("go")}</a></div>`}).join("")}</div>
   <p class="small" style="margin:0">${u("streak")}</p></section>
  <div class="tiles">
   <a class="tile" href="#cards"><span class="big">${due}</span><span>${u("dueCards")}</span></a>
   <a class="tile" href="#test"><span class="big">${mc}</span><span>${u("mistN")}</span></a>
   <a class="tile" href="#grammar"><b>${u("tabGram")}</b><span class="small">${lvU().map(n=>esc(uTitle(n))).slice(0,3).join(" · ")}…</span></a>
  </div>`;
  $$("#homeBox .lvlhero button").forEach(b=>b.onclick=()=>setLevel(b.dataset.l))}

/* ================= progress ================= */
function renderProg(){const lvQ=Q.filter(q=>lvU().includes(q.u));let r=0,n=0;lvQ.forEach(q=>{const s=qst[q.id];if(s){r+=s[0];n+=s[1]}});
  const lvW=W.filter(w=>lvU().includes(w.u)),lw=lvW.filter(w=>learned(w.k)).length;
  const wsl=wsLv(),wsFull=wsl.filter(w=>wsBest[w.id]>=w.items.join(" ").match(/\[[^\]]*\]/g).length).length;
  const ex=store.get("exam_"+LEVEL,"");let plan="";if(ex){const d=Math.ceil((new Date(ex)-new Date(today()))/DAY),left=lvW.length-lw;plan=d>0?u("pDays",d,left,Math.ceil(left/d)):u("pPast")}
  $("#progBox").innerHTML=`
  <section class="panel"><h2>${u("pTitle",LEVEL)}</h2>
   <div class="tiles"><div class="tile"><span class="big">${n?Math.round(r/n*100)+"%":"—"}</span><span>${u("pAcc")}</span></div><div class="tile"><span class="big">${n}</span><span>${u("pAns")}</span></div>
   <div class="tile"><span class="big">${lw}<span class="small"> / ${lvW.length}</span></span><span>${u("pCards")}</span></div><div class="tile"><span class="big">${wsFull}<span class="small"> / ${wsl.length}</span></span><span>${u("pWs")}</span></div></div></section>
  <section class="panel"><h2>${u("pUnits")}</h2><div class="topics">${lvU().map(k=>{let a=0,b=0;lvQ.filter(q=>q.u===k).forEach(q=>{const s=qst[q.id];if(s){a+=s[0];b+=s[1]}});const p=b?Math.round(a/b*100):0;
    return `<div class="trow" style="--c:${ucol(k)}"><span>${k}. ${esc(uTitle(k))}</span><span class="mini"><i style="width:${p}%"></i></span><span class="pct">${b?p+"%":"—"}</span></div>`}).join("")}</div></section>
  <section class="panel"><h2>${u("pTrain")}</h2><div class="topics">${TRM.map(([k,lab])=>{const s=tst[k]||[0,0],p=s[1]?Math.round(s[0]/s[1]*100):0;return `<div class="trow" style="--c:var(--accent)"><span>${u(lab)}</span><span class="mini"><i style="width:${p}%"></i></span><span class="pct">${s[1]?s[0]+"/"+s[1]:"—"}</span></div>`}).join("")}</div></section>
  <section class="panel"><h2>${u("pDate")}</h2><div class="row"><input type="date" id="pDate" value="${esc(ex)}"></div>${plan?`<p style="margin:0">${plan}</p>`:""}</section>
  <button class="linkbtn" id="pReset" style="align-self:flex-start">${u("pReset")}</button>`;
  $("#pDate").onchange=e=>{store.set("exam_"+LEVEL,e.target.value);renderProg()};
  $("#pReset").onclick=()=>{if(!confirm(u("pResetQ",LEVEL)))return;Q.filter(q=>lvU().includes(q.u)).forEach(q=>{delete qst[q.id];mist.delete(q.id)});lvW.forEach(w=>delete srs[w.k]);wsl.forEach(w=>delete wsBest[w.id]);
    store.set("qst",qst);store.set("mist",[...mist]);store.set("srs",srs);store.set("ws",wsBest);buildDeck();renderChips();renderProg()}}

/* ================= init ================= */
$$("#langSeg button").forEach(b=>b.onclick=()=>{LANG=b.dataset.v;store.set("lang",LANG);applyLang();renderChips();renderCardCtl();if(run&&!$("#quiz").hidden&&!run.answered)renderQ();setView(VIEW)});
$$("#lvlSeg button").forEach(b=>b.onclick=()=>setLevel(b.dataset.v));
$("#lvlName").textContent=LEVEL;document.title="English "+LEVEL;$$("#lvlSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===LEVEL));
applyLang();renderChips();buildDeck();route();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
